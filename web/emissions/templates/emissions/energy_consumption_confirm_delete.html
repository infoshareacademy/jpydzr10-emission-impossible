<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ title }}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
</head>
<body>
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card border-danger">
                <div class="card-header bg-danger text-white">
                    <h4 class="mb-0">
                        <i class="bi bi-exclamation-triangle"></i> Potwierdź usunięcie
                    </h4>
                </div>
                <div class="card-body">
                    <p class="card-text">Czy na pewno chcesz usunąć ten rekord?</p>
                    <table class="table table-sm">
                        <tr>
                            <th>Firma:</th>
                            <td>{{ record.company }}</td>
                        </tr>
                        <tr>
                            <th>Rok:</th>
                            <td>{{ record.year }}</td>
                        </tr>
                        <tr>
                            <th>Typ energii:</th>
                            <td>{{ record.energy_type }}</td>
                        </tr>
                        <tr>
                            <th>Ilość:</th>
                            <td>{{ record.amount }} {{ record.unit }}</td>
                        </tr>
                    </table>
                    <p class="text-danger fw-bold">
                        <i class="bi bi-exclamation-circle"></i>
                        Ta operacja jest nieodwracalna!
                    </p>
                    <form method="post">
                        {% csrf_token %}
                        <div class="d-flex gap-2">
                            <button type="submit" class="btn btn-danger btn-lg px-4">
                                <i class="bi bi-trash"></i> Usuń
                            </button>
                            <a href="{% url 'emissions:energy_consumption_list' %}"
                               class="btn btn-secondary btn-lg px-4">
                                <i class="bi bi-arrow-left"></i> Anuluj
                            </a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="pl">
    <head>
        <meta charset="utf-8"/>
        <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
        <title>Usuń Cel - Emission Impossible</title>
        <script src="https://cdn.tailwindcss.com?plugins=forms"></script>
        <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet"/>
        <style>
            body { font-family: 'Inter', sans-serif; background-color: #f7faf6; }
            .stepped-border { clip-path: polygon(4px 0, calc(100% - 4px) 0, 100% 4px, 100% calc(100% - 4px), calc(100% - 4px) 100%, 4px 100%, 0 calc(100% - 4px), 0 4px); }
        </style>
    </head>
    <body class="p-8 min-h-screen flex items-center justify-center">

        <div class="max-w-xl w-full bg-white border-2 border-red-700 p-8 shadow-[6px_6px_0px_0px_#b91c1c] stepped-border">

            <h1 class="text-3xl font-black uppercase tracking-tighter mb-4 text-red-700 border-b-2 border-red-700 pb-4">
                Potwierdź usunięcie
            </h1>

            <p class="text-gray-800 font-bold mb-6">
                Czy na pewno chcesz usunąć poniższy cel redukcyjny? Ta operacja jest nieodwracalna.
            </p>

            <div class="bg-red-50 p-4 border-2 border-red-200 mb-6 font-mono text-sm">
                <strong>Cel:</strong> {{ object.target_name }}<br>
                <strong>Zakres:</strong> {{ object.scope }}<br>
                <strong>Redukcja:</strong> {{ object.reduction_pct }}%
            </div>

            <form method="post">
                {% csrf_token %}
                <div class="pt-2 flex justify-between items-center">
                    <a href="{% url 'what_if:reduction-target-list' company_id=company_id %}" class="text-sm font-bold uppercase hover:underline text-gray-600">
                        &larr; Anuluj
                    </a>
                    <button type="submit" class="px-6 py-2 bg-red-600 text-white border-2 border-red-900 font-bold uppercase tracking-wider text-sm shadow-[2px_2px_0px_0px_#7f1d1d] hover:translate-x-[1px] hover:translate-y-[1px] hover:shadow-none transition-all stepped-border">
                        Tak, usuń cel
                    </button>
                </div>
            </form>

        </div>
    </body>
</html>

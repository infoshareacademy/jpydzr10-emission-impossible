{% extends "home.html" %}

{% block content %}
    <div class="password-reset-confirm">
        {% if validlink %}
            <h2>Wprowadź nowe hasło</h2>
            <form method="post">
                {% csrf_token %}
                {{ form.as_p }}
                <button type="submit">Zmień hasło</button>
            </form>
        {% else %}
            <h2>Link wygasł</h2>
            <p>Link do resetowania hasła jest nieprawidłowy lub wygasł. <a href="{% url 'password_reset' %}">Poproś o nowy link.</a></p>
        {% endif %}
    </div>
{% endblock content %}

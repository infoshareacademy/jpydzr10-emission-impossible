<!DOCTYPE html>
<html lang="pl">
    <head>
        <meta charset="UTF-8">
        <title>Logowanie - Emission Impossible</title>
    </head>
    <body>

        <div>
            <h1>Emission Impossible</h1>
            <p>CARBON INTELLIGENCE</p>

            <h2>Zaloguj się do systemu</h2>

            {% if form.errors %}
                <p style="color: red;">Nazwa użytkownika (email) lub hasło są nieprawidłowe. Spróbuj ponownie.</p>
            {% endif %}

            <form method="post" action="">
                {% csrf_token %}

                <div>
                    <label for="id_username">Email / Nazwa użytkownika</label><br>
                    <input type="text" name="username" autofocus autocapitalize="none" autocomplete="username" maxlength="150" required id="id_username" placeholder="adres@firma.pl">
                </div>

                <br>

                <div>
                    <label for="id_password">Hasło</label>
                    <a href="{% url 'password_reset' %}">Zapomniałeś hasła?</a><br>
                    <input type="password" name="password" autocomplete="current-password" required id="id_password" placeholder="********">
                </div>

                <br>

                <div>
                    <input type="checkbox" name="remember_me" id="id_remember_me">
                    <label for="id_remember_me">Zapamiętaj mnie</label>
                </div>

                <br>

                <button type="submit">Zaloguj się</button>

                <input type="hidden" name="next" value="{{ next }}">
            </form>

            <br><br>

            <div>
                <a href="#">Polityka prywatności</a>
                <span> | </span>
                <a href="#">Kontakt z administratorem</a>
            </div>
        </div>

    </body>
</html>

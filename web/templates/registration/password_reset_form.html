{% extends "home.html" %}
{% block content %}
    <div class="password-reset-container">
        <h2>Resetowanie hasła</h2>
        <p>Podaj adres e-mail powiązany z Twoim kontem, a wyślemy Ci link do zresetowania hasła.</p>

        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit">Wyślij link resetujący</button>
        </form>
    </div>
{% endblock content%}

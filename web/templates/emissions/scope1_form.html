<!DOCTYPE html>
<html lang="pl">
    <head>
        <meta charset="utf-8"/>
        <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
        <title>Dodaj wpis - Emission Impossible</title>
        <script src="https://cdn.tailwindcss.com?plugins=forms"></script>
        <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet"/>
        <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet" />
        <style>
            body { font-family: 'Inter', sans-serif; background-color: #f7faf6; }
            .stepped-border {
                clip-path: polygon(4px 0, calc(100% - 4px) 0, 100% 4px, 100% calc(100% - 4px), calc(100% - 4px) 100%, 4px 100%, 0 calc(100% - 4px), 0 4px);
            }
            .material-symbols-outlined { text-transform: none !important; }
        </style>
    </head>
    <body class="p-4 md:p-8 flex justify-center items-start min-h-screen">

        <div class="max-w-2xl w-full bg-white border-2 border-black shadow-[6px_6px_0px_0px_#000] p-8 stepped-border">

        <!-- Dynamiczny nagłówek na podstawie modelu -->
            <header class="mb-8">
                <div class="inline-flex items-center gap-2 px-3 py-1 bg-[#0f6e56] text-white text-xs font-bold uppercase tracking-wider stepped-border mb-4">
                    Zakres 1
                </div>
                <h2 class="text-3xl font-black text-black uppercase tracking-tighter">
                    Dodaj: {{ model_verbose_name|default:"Nowy wpis" }}
                </h2>
            </header>

        <!-- Formularz -->
            <form method="post" action="" class="space-y-6">
                {% csrf_token %}

                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <!-- Pętla renderująca wszystkie pola formularza dynamicznie -->
                    {% for field in form %}
                        <div class="flex flex-col gap-1 {% if field.name == 'notes' or field.name == 'company' %}md:col-span-2{% endif %}">
                            <label for="{{ field.id_for_label }}" class="font-bold text-sm uppercase text-gray-700 tracking-wide">
                                {{ field.label }}
                            </label>

                            {{ field }}

                        <!-- Obsługa błędów walidacji pola -->
                            {% if field.errors %}
                                <div class="bg-red-100 border border-red-500 text-red-700 px-3 py-1 text-xs font-bold mt-1">
                                    {{ field.errors|striptags }}
                                </div>
                            {% endif %}
                        </div>
                    {% endfor %}
                </div>

            <!-- Przyciski akcji -->
                <div class="flex gap-4 pt-6 mt-6 border-t-2 border-gray-200">
                    <a href="{% url 'emissions:dashboard' company_id %}" class="flex-1 py-3 bg-gray-200 text-black border-2 border-black font-bold uppercase tracking-wider text-center hover:bg-gray-300 transition-colors shadow-[2px_2px_0px_0px_#000] hover:translate-x-[1px] hover:translate-y-[1px] hover:shadow-none">
                        Anuluj
                    </a>
                    <button type="submit" class="flex-1 py-3 bg-[#005440] text-white border-2 border-black font-bold uppercase tracking-wider hover:bg-[#0f6e56] transition-colors shadow-[2px_2px_0px_0px_#000] hover:translate-x-[1px] hover:translate-y-[1px] hover:shadow-none flex justify-center items-center gap-2">
                        <span class="material-symbols-outlined text-sm">save</span>
                        Zapisz wpis
                    </button>
                </div>
            </form>

        </div>

    </body>
</html>

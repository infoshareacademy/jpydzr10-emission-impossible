services:
  db:
    image: postgres:16
    restart: always
    environment:
      POSTGRES_DB: emission_db
      POSTGRES_USER: emission_user
      POSTGRES_PASSWORD: emission_pass
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    # Zapisuj stan na dysk co 60 sekund, jeśli była min. 1 zmiana (chroni zadania Celery)
    command: redis-server --save 60 1 --loglevel warning
volumes:
  postgres_data:
  redis_data: